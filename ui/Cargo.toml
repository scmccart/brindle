[package]
name = "brindle-ui"
version = "0.4.0"
edition = "2024"
description = "Brindle's shared UI components on GPUI, modelled on shadcn/ui: tokens, overlay primitives, components and the text input"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
gpui = "0.2.2"
log = "0.4"

# `TestAppContext` for the components' tests; gpui's own feature, so no
# crate the closed list doesn't name.
[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
