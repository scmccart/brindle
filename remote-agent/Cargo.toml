[package]
name = "brindle-remote-agent"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "brindle-remote"
path = "src/main.rs"

[dependencies]
brindle-remote-protocol = { path = "../remote-protocol" }
brindle-term-core = { path = "../term-core" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The holder's pseudoconsoles (`conpty`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

# The tests' anonymous pipes, and the real command-line parser.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
  "Win32_System_Pipes",
  "Win32_UI_Shell",
] }
