[package]
name = "brindle-remote-agent"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "brindle-remote"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
