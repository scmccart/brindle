# Version updates for the workflow's actions. Cargo gets security updates
# only: Cargo.lock came from GPUI's own lockfile, and broad updates break it
# (see CLAUDE.md). Its entry exists only to give those security PRs a
# Conventional Commits subject; open-pull-requests-limit 0 turns off its
# version updates.
#
# Both entries' subjects read `chore(deps): bump …` (Dependabot adds the
# scope and the colon), which CI's commit check accepts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
