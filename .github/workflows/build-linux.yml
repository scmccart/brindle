# The Linux release build, called by CI and by releases: brindle, the static
# x86-64 remote helper (uploaded as brindle-remote-linux-x86_64, which the
# Windows build packs too) and the release archive (brindle-linux-x64), which
# it installs and uninstalls through the one-command installer.
#
# No concurrency group here: the caller's applies, and a matching one would
# cancel the caller.

name: Build Linux

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build; empty for the caller's own.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUILD_PACKAGES: build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfreetype-dev

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y --no-install-recommends $BUILD_PACKAGES musl-tools
      # rust-toolchain.toml names the toolchain.
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release --locked
      - name: Build static Linux remote helper
        run: |
          cargo build --release --locked -p brindle-remote-agent --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/brindle-remote brindle-remote-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: brindle-remote-linux-x86_64
          path: brindle-remote-linux-x86_64
          retention-days: 14
      - name: Release archive
        run: scripts/package-linux.sh
      # The archive holds exactly the files scripts/package-linux.sh names,
      # so nothing else this build makes (the tests' fake ACP agent, say)
      # slips in. A change to what it packs changes this list with it.
      - name: Release archive contents
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          name=brindle-$version-x86_64-unknown-linux-gnu
          expected=$(printf '%s\n' "$name/" "$name/LICENSE-APACHE" "$name/LICENSE-MIT" "$name/brindle" "$name/brindle-remote-linux-x86_64" | LC_ALL=C sort)
          actual=$(tar -tzf "target/dist/$name.tar.gz" | LC_ALL=C sort)
          echo "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "the archive's files aren't the expected ones:" >&2
            diff <(echo "$expected") <(echo "$actual") >&2 || true
            exit 1
          fi
      # The one-command installer as a release publishes it (release.yml
      # stamps scripts/get.sh as install.sh), read from stdin as `curl | sh`
      # runs it, against this archive in a local release directory and into
      # a private prefix: an install, a tampered SHA256SUMS that must fail and
      # change nothing, and --uninstall.
      - name: One-command install and uninstall
        run: |
          fail() { echo "one-command install: $*" >&2; exit 1; }
          state() { cd "$PREFIX" && find . -type f -exec sha256sum {} + | sort && stat -c '%n %i %Y' bin/*; }
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          name=brindle-$version-x86_64-unknown-linux-gnu
          release=$RUNNER_TEMP/release
          export PREFIX=$RUNNER_TEMP/prefix XDG_DATA_HOME=$RUNNER_TEMP/data BRINDLE_DOWNLOAD_BASE=file://$RUNNER_TEMP/release
          mkdir -p "$release"
          cp "target/dist/$name.tar.gz" "$release/"
          sed "s/@VERSION@/$version/" scripts/get.sh > "$release/install.sh"
          (cd "$release" && sha256sum -- "$name.tar.gz" > SHA256SUMS)

          sh < "$release/install.sh"
          [ "$("$PREFIX/bin/brindle" --version)" = "brindle $version" ] || fail "brindle --version"
          [ "$("$PREFIX/bin/brindle-remote-linux-x86_64" --version)" = "$version" ] || fail "helper --version"
          grep -qx "Exec=$PREFIX/bin/brindle" "$PREFIX/share/applications/brindle.desktop" || fail "desktop entry"
          [ -f "$PREFIX/share/icons/hicolor/scalable/apps/brindle.svg" ] || fail "icon"

          before=$(state)
          printf '%064d  %s\n' 0 "$name.tar.gz" > "$release/SHA256SUMS"
          if sh < "$release/install.sh" 2> "$RUNNER_TEMP/tampered.log"; then fail "a tampered SHA256SUMS installed"; fi
          cat "$RUNNER_TEMP/tampered.log"
          grep -q 'checksum failed' "$RUNNER_TEMP/tampered.log" || fail "no checksum message"
          [ "$(state)" = "$before" ] || fail "a tampered SHA256SUMS changed the install"

          sh -s -- --uninstall < "$release/install.sh"
          [ -z "$(ls -A "$PREFIX/bin")" ] || fail "left in bin: $(ls -A "$PREFIX/bin")"
          [ ! -e "$PREFIX/share/applications/brindle.desktop" ] || fail "desktop entry left"
          [ ! -e "$PREFIX/share/icons/hicolor/scalable/apps/brindle.svg" ] || fail "icon left"
      # The built-in themes' UI tokens as CSS, for the website (released
      # beside the archives).
      - name: UI tokens
        run: target/release/brindle --export-ui-tokens > target/dist/brindle-ui-tokens.css
      - uses: actions/upload-artifact@v7
        with:
          name: brindle-linux-x64
          path: |
            target/dist/*.tar.gz
            target/dist/brindle-ui-tokens.css
          retention-days: 14
