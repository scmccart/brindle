# Unit tests, a release build, and the end-to-end suite on two tmux versions,
# plus a Windows build and tests. The e2e jobs are advisory: they go red on
# failure but aren't required checks.
#
# Every push and every pull request runs it. Dependabot's branches always
# have a PR, so their pushes are skipped instead of running twice.

name: CI

on:
  push:
    branches-ignore: ["dependabot/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The desktop's toolchain; the runner image's own lags behind.
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: always
  BUILD_PACKAGES: build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfreetype-dev

jobs:
  # Checks the commit messages a push or pull request adds (see CLAUDE.md).
  # A pull request is checked from its base. A push is checked from
  # `before`, unless that isn't an ancestor of HEAD: a new branch (all
  # zeros) or a force-push. Those and workflow_dispatch check the commits
  # not on origin/main, which on main itself is nothing.
  commits:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # commitlint 21 needs 22.12 or later.
          node-version: 24
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT" = push ] && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            base=$BEFORE
          fi
          scripts/lint-commits ${base:+"$base"}

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y --no-install-recommends $BUILD_PACKAGES
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - run: cargo test --locked
      - name: e2e harness self-test
        run: BRINDLE_E2E=1 cargo test --locked --test e2e -- --self-test
      - name: perf harness self-test
        run: BRINDLE_PERF=1 cargo test --locked --test perf -- --self-test

  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y --no-install-recommends $BUILD_PACKAGES
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      # GPUI's release build compiles its shaders with fxc.exe, which it
      # otherwise looks for only on PATH and in one SDK version's directory.
      - name: Find fxc.exe
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { throw "no fxc.exe in the Windows SDK" }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      # The packaged ConPTY that build.rs embeds.
      - run: scripts/fetch-conpty.ps1
        shell: pwsh
      - run: cargo build --release --locked
      - run: cargo test --locked
      - name: e2e harness self-test
        run: cargo test --locked --test e2e -- --self-test
        env:
          BRINDLE_E2E: "1"
      - name: perf harness self-test
        run: cargo test --locked --test perf -- --self-test
        env:
          BRINDLE_PERF: "1"
      - name: Version resource and DPI manifest in brindle.exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/brindle.exe).Path
          $info = (Get-Item $exe).VersionInfo
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($info.ProductName -ne 'Brindle' -or $info.ProductVersion -ne $version) {
            throw "version resource: '$($info.ProductName)' '$($info.ProductVersion)', expected Brindle $version"
          }
          # GPUI embeds the manifest; without it the window renders blurry above 100% scale.
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName | Select-Object -Last 1
          & $mt.FullName -nologo "-inputresource:$exe;#1" "-out:manifest.xml"
          if (-not (Select-String -Path manifest.xml -Pattern 'PerMonitorV2' -Quiet)) { throw 'no PerMonitorV2 in the manifest' }
      # brindle.exe is a GUI program, so PowerShell waits for it only
      # through Start-Process -Wait.
      - name: Start Menu shortcut (--install-desktop / --uninstall-desktop)
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/brindle.exe).Path
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Brindle.lnk'
          function Run($arguments) { (Start-Process $exe -ArgumentList $arguments -Wait -PassThru -NoNewWindow).ExitCode }
          if ((Run '--install-desktop') -ne 0 -or -not (Test-Path $lnk)) { throw 'install failed' }
          $item = (New-Object -ComObject Shell.Application).Namespace((Split-Path $lnk)).ParseName('Brindle.lnk')
          $id = $item.ExtendedProperty('System.AppUserModel.ID')
          if ($id -ne 'Brindle.Terminal') { throw "AppUserModelID is '$id'" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne $exe) { throw "target is '$target'" }
          if ((Run '--uninstall-desktop') -ne 0 -or (Test-Path $lnk)) { throw 'uninstall failed' }
          if ((Run '--uninstall-desktop') -ne 0) { throw 'uninstalling twice failed' }
          if ((Run '--install-desktop --prefix C:\Tools') -ne 2 -or (Test-Path $lnk)) { throw '--prefix was not rejected' }

  # The Windows cases of the end-to-end suite, on the runner's desktop.
  # Advisory, like the Linux e2e jobs.
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: scripts/fetch-conpty.ps1
        shell: pwsh
      - name: Build
        run: cargo test --locked --test e2e --no-run
      - name: End-to-end suite
        run: cargo test --locked --test e2e
        env:
          BRINDLE_E2E: "1"
          BRINDLE_E2E_SLOW: "2"
      - name: Upload the suite's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows
          path: target/tmp/e2e/
          retention-days: 14

  e2e:
    name: e2e (tmux ${{ matrix.tmux.version }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tmux:
          # Ubuntu's package, the desktop's version.
          - version: "3.6a"
            reports: tmux 3.6
          # The latest release, built from source. tmux publishes no
          # checksums, so the tarball's is pinned here.
          - version: "3.8"
            reports: tmux 3.8
            sha256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
        # Each tmux version's suite runs in 4 shards (every 4th case). The
        # count is here, in the job name and in the suite's --shard.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y --no-install-recommends $BUILD_PACKAGES \
            xvfb x11-utils openbox mesa-vulkan-drivers libvulkan1 fonts-dejavu-core dbus tmux less \
            ${{ matrix.tmux.sha256 && 'libevent-dev libncurses-dev bison' || '' }}
      - name: Cache tmux ${{ matrix.tmux.version }}
        if: matrix.tmux.sha256
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: ~/tmux-${{ matrix.tmux.version }}
          key: tmux-${{ matrix.tmux.version }}-${{ matrix.tmux.sha256 }}-ubuntu-26.04
      - name: Build tmux ${{ matrix.tmux.version }}
        if: matrix.tmux.sha256 && steps.tmux-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO "https://github.com/tmux/tmux/releases/download/${{ matrix.tmux.version }}/tmux-${{ matrix.tmux.version }}.tar.gz"
          echo "${{ matrix.tmux.sha256 }}  tmux-${{ matrix.tmux.version }}.tar.gz" | sha256sum -c
          tar xzf "tmux-${{ matrix.tmux.version }}.tar.gz"
          cd "tmux-${{ matrix.tmux.version }}"
          ./configure --prefix="$HOME/tmux-${{ matrix.tmux.version }}"
          make -j"$(nproc)"
          make install
      - name: Put tmux ${{ matrix.tmux.version }} first on PATH
        if: matrix.tmux.sha256
        run: echo "$HOME/tmux-${{ matrix.tmux.version }}/bin" >> "$GITHUB_PATH"
      - name: Check the tmux version
        run: |
          tmux -V
          test "$(tmux -V)" = "${{ matrix.tmux.reports }}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - name: Build
        run: cargo test --locked --test e2e --no-run
      - name: End-to-end suite
        run: scripts/with-xvfb cargo test --locked --test e2e -- --shard ${{ matrix.shard }}/4
        env:
          BRINDLE_E2E: "1"
          # lavapipe and shared runners are slower than a desktop.
          BRINDLE_E2E_SLOW: "2"
      - name: Upload the suite's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tmux-${{ matrix.tmux.version }}-shard-${{ matrix.shard }}
          path: target/tmp/e2e/
          retention-days: 14
