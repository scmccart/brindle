# Unit tests, clippy with -D warnings, a release build, and the end-to-end
# suite, plus a Windows build, tests and clippy. The e2e jobs are advisory:
# they go red on failure but aren't required checks. The release and Windows
# builds are the reusable build-linux.yml and build-windows.yml, which
# releases run too; the archive jobs run e2e cases against what they upload.
# rust-toolchain.toml pins Rust for every job.
#
# Pushes to main and pull requests run it. A pull request that changes only
# docs (Markdown, OpenSpec, the licenses) doesn't. Its required check, the
# PR title, is a separate workflow (pr-title.yml) and still runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
      - "openspec/**"
      - "LICENSE-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BUILD_PACKAGES: build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfreetype-dev

jobs:
  # Checks the commit messages a push or pull request adds (see CLAUDE.md).
  # A pull request is checked from its base. A push is checked from
  # `before`, unless that isn't an ancestor of HEAD: a new branch (all
  # zeros) or a force-push. Those and workflow_dispatch check the commits
  # not on origin/main, which on main itself is nothing.
  commits:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # commitlint 21 needs 22.12 or later.
          node-version: 24
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT" = push ] && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            base=$BEFORE
          fi
          scripts/lint-commits ${base:+"$base"}
      # actionlint (and shellcheck on every run: script), configured by
      # .github/actionlint.yaml.
      - name: Lint the workflows
        run: scripts/lint-workflows
      # The Windows icons are rendered from the SVG and committed
      # (scripts/render-icons.sh), so the SVG's last change must be in or
      # before the .ico's.
      - name: Check the Windows icons are rendered from the current SVG
        run: |
          svg=$(git log -1 --format=%H -- assets/brindle.svg)
          ico=$(git log -1 --format=%H -- assets/windows/brindle.ico)
          if [ -z "$ico" ] || ! git merge-base --is-ancestor "$svg" "$ico"; then
            echo "assets/brindle.svg changed after assets/windows/brindle.ico: run scripts/render-icons.sh and commit its output" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y --no-install-recommends $BUILD_PACKAGES
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      # Brindle matches its remote helper by version, and release-please
      # bumps all six crates together, so they never differ.
      - name: Check the workspace crates share one version
        run: |
          versions=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | "\(.name) \(.version)"')
          if [ "$(echo "$versions" | cut -d' ' -f2 | sort -u | wc -l)" -ne 1 ]; then
            echo "the workspace crates' versions differ:" >&2
            echo "$versions" >&2
            exit 1
          fi
      # Tests that skip for want of a capability record it in
      # target/tmp/skipped.log; start it empty, and print it after the run.
      - name: Clear the skipped-tests log
        run: rm -f target/tmp/skipped.log
      - run: cargo test --locked --workspace
        env:
          # The runner is disposable, so the scopes test may start scopes in
          # its user's systemd manager (it skips where there is none).
          BRINDLE_SCOPE_TEST: "1"
          # The runner builds debug binaries, which list their fault switches.
          BRINDLE_TEST_REQUIRE: fault-switches
      - name: Tests skipped for want of a capability
        if: always()
        run: cat target/tmp/skipped.log 2>/dev/null || echo "none"
      - name: e2e harness self-test
        run: BRINDLE_E2E=1 cargo test --locked -p brindle --test e2e -- --self-test
      - name: perf harness self-test
        run: BRINDLE_PERF=1 cargo test --locked -p brindle --test perf -- --self-test

  # Lints on every target of the workspace. A lint is an error here, so a rule
  # the lints hold (docs/architecture) is checked by CI. The crate roots'
  # attributes switch on the restriction lints; Windows-only code is linted by
  # build-windows.yml. Like test, it runs on release pull requests too.
  clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y --no-install-recommends $BUILD_PACKAGES
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # The builds and e2e jobs below skip release-please's release pull requests
  # (branches release-please--…). Those change only versions and
  # CHANGELOG.md on code CI has already passed, and release.yml builds and
  # checks both platforms again before publishing. commits and test still
  # run: test's version check and --locked build catch a bad version bump.

  # The release build, the static remote helper and the Linux archive.
  release:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    uses: ./.github/workflows/build-linux.yml

  # The Windows build, tests, exe checks and zip, with its WinGet manifest
  # validated.
  windows:
    needs: release
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    uses: ./.github/workflows/build-windows.yml

  # The Windows cases of the end-to-end suite, on the runner's desktop.
  # Advisory, like the Linux e2e jobs.
  windows-e2e:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: scripts/fetch-conpty.ps1
        shell: pwsh
      # The helper's package builds the fake ACP agent beside it, which the
      # windows-agent-* cases find beside the suite's build.
      - name: Build
        run: |
          cargo build --locked -p brindle-remote-agent
          cargo test --locked -p brindle --test e2e --no-run
      - name: End-to-end suite
        run: cargo test --locked -p brindle --test e2e
        env:
          BRINDLE_E2E: "1"
          BRINDLE_E2E_SLOW: "2"
          BRINDLE_E2E_SWITCHES_REQUIRED: "1"
      - name: Upload the suite's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows
          path: target/tmp/e2e/
          retention-days: 14

  # The Windows local and agent cases against the zip build-windows.yml uploaded,
  # unpacked as a user unpacks it: its brindle.exe, with the packaged
  # brindle-remote.exe (and the ConPTY it embeds) beside it and no
  # BRINDLE_SERVER_HELPER, so what runs is what the zip carries. A job of
  # its own after the build, so windows-e2e doesn't wait for both builds.
  # Advisory, like windows-e2e.
  windows-e2e-archive:
    needs: windows
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - uses: actions/download-artifact@v7
        with:
          name: brindle-windows-x64
          path: ${{ runner.temp }}/zip
      - name: Unpack the zip
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem "$env:RUNNER_TEMP/zip" -Filter *.zip)
          if ($zip.Count -ne 1) { throw "expected one zip, found $($zip.Count)" }
          Expand-Archive $zip[0].FullName "$env:RUNNER_TEMP/unpacked"
          Get-ChildItem "$env:RUNNER_TEMP/unpacked"
      # The zip doesn't carry the fake ACP agent the agent cases run, so it
      # is built here and named.
      - name: Build the suite and the fake ACP agent
        run: |
          cargo test --locked -p brindle --test e2e --no-run
          cargo build --locked --release -p brindle-remote-agent --bin brindle-fake-acp-agent
      - name: ConPTY, PowerShell and agent cases from the zip
        run: cargo test --locked -p brindle --test e2e -- windows-conpty windows-pwsh-integration windows-agent-
        env:
          BRINDLE_E2E: "1"
          BRINDLE_E2E_SLOW: "2"
          BRINDLE_E2E_BIN: ${{ runner.temp }}/unpacked/brindle.exe
          BRINDLE_FAKE_ACP_AGENT: ${{ github.workspace }}/target/release/brindle-fake-acp-agent.exe
      - name: Upload the suite's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows-archive
          path: target/tmp/e2e/
          retention-days: 14

  # The local-server, remote (SSH and container, through Docker) and agent
  # cases against the Linux archive build-linux.yml uploaded, installed as a user
  # installs it: the one-command installer, from a local release directory
  # into a private prefix. The suite runs the installed brindle, with the
  # helper beside it and no BRINDLE_REMOTE_AGENT or BRINDLE_SERVER_HELPER, so
  # a missing or mismatched helper in the archive fails. Here rather than in
  # build-linux.yml, which every release runs on code CI has already passed:
  # the suite would add its whole run to each release. A release build has
  # no fault switches, so the cases that need one skip. Advisory, like e2e.
  e2e-archive:
    needs: release
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y --no-install-recommends $BUILD_PACKAGES musl-tools \
            xvfb x11-utils openbox mesa-vulkan-drivers libvulkan1 fonts-dejavu-core dbus less
      # The musl target: the fake ACP agent is built static.
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - uses: actions/download-artifact@v7
        with:
          name: brindle-linux-x64
          path: ${{ runner.temp }}/release
      # As build-linux.yml's install step does, without the uninstall: the
      # installer stamped as a release stamps it, read from stdin as
      # `curl | sh` runs it.
      - name: Install the archive with the one-command installer
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          release=$RUNNER_TEMP/release
          sed "s/@VERSION@/$version/" scripts/get.sh > "$release/install.sh"
          (cd "$release" && sha256sum -- "brindle-$version-x86_64-unknown-linux-gnu.tar.gz" > SHA256SUMS)
          PREFIX=$RUNNER_TEMP/prefix XDG_DATA_HOME=$RUNNER_TEMP/data BRINDLE_DOWNLOAD_BASE=file://$release \
            sh < "$release/install.sh"
          ls -l "$RUNNER_TEMP/prefix/bin"
      # The archive doesn't carry the fake ACP agent the agent cases run, so
      # it is built here, static: the agent cases run it here (named by
      # BRINDLE_FAKE_ACP_AGENT) and remote-agent-ssh copies it into its
      # container (from where README.md's static build puts it).
      - name: Build the suite and the fake ACP agent
        run: |
          cargo test --locked -p brindle --test e2e --no-run
          cargo build --locked --release -p brindle-remote-agent --bin brindle-fake-acp-agent \
            --target x86_64-unknown-linux-musl
      - name: Local-server, remote and agent cases from the installed archive
        run: scripts/with-xvfb cargo test --locked -p brindle --test e2e -- local-server remote- agent-
        env:
          BRINDLE_E2E: "1"
          BRINDLE_E2E_SLOW: "2"
          BRINDLE_E2E_BIN: ${{ runner.temp }}/prefix/bin/brindle
          BRINDLE_FAKE_ACP_AGENT: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/brindle-fake-acp-agent
          BRINDLE_REMOTE_E2E_REQUIRED: "1"
      - name: Upload the suite's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-archive
          path: target/tmp/e2e/
          retention-days: 14

  e2e:
    name: e2e (${{ matrix.shard }}/3)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The suite runs in 3 shards (every 3rd case). The count is here, in
        # the job name and in the suite's --shard.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          # zsh and fish: the shell-script-line cases, which skip without them.
          # xclip: the clipboard cases' other application.
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y --no-install-recommends $BUILD_PACKAGES \
            xvfb x11-utils xclip openbox mesa-vulkan-drivers libvulkan1 fonts-dejavu-core dbus less zsh fish musl-tools
      # The musl target: remote-agent-ssh copies a static fake ACP agent
      # into its container.
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - name: Build
        run: |
          cargo build --locked -p brindle-remote-agent
          cargo build --locked --release -p brindle-remote-agent --bin brindle-fake-acp-agent \
            --target x86_64-unknown-linux-musl
          cargo test --locked -p brindle --test e2e --no-run
      - name: End-to-end suite
        run: scripts/with-xvfb cargo test --locked -p brindle --test e2e -- --shard ${{ matrix.shard }}/3
        env:
          BRINDLE_E2E: "1"
          BRINDLE_E2E_CLIPBOARD_REQUIRED: "1"
          # lavapipe and shared runners are slower than a desktop.
          BRINDLE_E2E_SLOW: "2"
          BRINDLE_E2E_SWITCHES_REQUIRED: "1"
          BRINDLE_REMOTE_E2E_REQUIRED: "1"
      - name: Upload the suite's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: target/tmp/e2e/
          retention-days: 14
