# Unit tests, a release build, and the end-to-end suite, plus a Windows build
# and tests. The e2e jobs are advisory: they go red on
# failure but aren't required checks. The release and Windows builds are the
# reusable build-linux.yml and build-windows.yml, which releases run too.
# rust-toolchain.toml pins Rust for every job.
#
# Pushes to main and pull requests run it. A pull request that changes only
# docs (Markdown, OpenSpec, the licenses) doesn't. Its required check, the
# PR title, is a separate workflow (pr-title.yml) and still runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
      - "openspec/**"
      - "LICENSE-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BUILD_PACKAGES: build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfreetype-dev

jobs:
  # Checks the commit messages a push or pull request adds (see CLAUDE.md).
  # A pull request is checked from its base. A push is checked from
  # `before`, unless that isn't an ancestor of HEAD: a new branch (all
  # zeros) or a force-push. Those and workflow_dispatch check the commits
  # not on origin/main, which on main itself is nothing.
  commits:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # commitlint 21 needs 22.12 or later.
          node-version: 24
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT" = push ] && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
            base=$BEFORE
          fi
          scripts/lint-commits ${base:+"$base"}
      # The Windows icons are rendered from the SVG and committed
      # (scripts/render-icons.sh), so the SVG's last change must be in or
      # before the .ico's.
      - name: Check the Windows icons are rendered from the current SVG
        run: |
          svg=$(git log -1 --format=%H -- assets/brindle.svg)
          ico=$(git log -1 --format=%H -- assets/windows/brindle.ico)
          if [ -z "$ico" ] || ! git merge-base --is-ancestor "$svg" "$ico"; then
            echo "assets/brindle.svg changed after assets/windows/brindle.ico: run scripts/render-icons.sh and commit its output" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y --no-install-recommends $BUILD_PACKAGES
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      # Brindle matches its remote helper by version, and release-please
      # bumps all five crates together, so they never differ.
      - name: Check the workspace crates share one version
        run: |
          versions=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | "\(.name) \(.version)"')
          if [ "$(echo "$versions" | cut -d' ' -f2 | sort -u | wc -l)" -ne 1 ]; then
            echo "the workspace crates' versions differ:" >&2
            echo "$versions" >&2
            exit 1
          fi
      - run: cargo test --locked --workspace
      - name: e2e harness self-test
        run: BRINDLE_E2E=1 cargo test --locked -p brindle --test e2e -- --self-test
      - name: perf harness self-test
        run: BRINDLE_PERF=1 cargo test --locked -p brindle --test perf -- --self-test

  # The builds and e2e jobs below skip release-please's release pull requests
  # (branches release-please--…). Those change only versions and
  # CHANGELOG.md on code CI has already passed, and release.yml builds and
  # checks both platforms again before publishing. commits and test still
  # run: test's version check and --locked build catch a bad version bump.

  # The release build, the static remote helper and the Linux archive.
  release:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    uses: ./.github/workflows/build-linux.yml

  # The Windows build, tests, exe checks and zip, with its WinGet manifest
  # validated.
  windows:
    needs: release
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    uses: ./.github/workflows/build-windows.yml

  # The Windows cases of the end-to-end suite, on the runner's desktop.
  # Advisory, like the Linux e2e jobs.
  windows-e2e:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: scripts/fetch-conpty.ps1
        shell: pwsh
      - name: Build
        run: cargo test --locked -p brindle --test e2e --no-run
      - name: End-to-end suite
        run: cargo test --locked -p brindle --test e2e
        env:
          BRINDLE_E2E: "1"
          BRINDLE_E2E_SLOW: "2"
      - name: Upload the suite's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows
          path: target/tmp/e2e/
          retention-days: 14

  e2e:
    name: e2e (${{ matrix.shard }}/3)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The suite runs in 3 shards (every 3rd case). The count is here, in
        # the job name and in the suite's --shard.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y --no-install-recommends $BUILD_PACKAGES \
            xvfb x11-utils openbox mesa-vulkan-drivers libvulkan1 fonts-dejavu-core dbus less
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
      - name: Build
        run: |
          cargo build --locked -p brindle-remote-agent
          cargo test --locked -p brindle --test e2e --no-run
      - name: End-to-end suite
        run: scripts/with-xvfb cargo test --locked -p brindle --test e2e -- --shard ${{ matrix.shard }}/3
        env:
          BRINDLE_E2E: "1"
          # lavapipe and shared runners are slower than a desktop.
          BRINDLE_E2E_SLOW: "2"
          BRINDLE_REMOTE_E2E_REQUIRED: "1"
      - name: Upload the suite's output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: target/tmp/e2e/
          retention-days: 14
