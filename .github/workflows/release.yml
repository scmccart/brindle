# Releases, driven by Conventional Commits through release-please
# (release-please-config.json, .release-please-manifest.json).
#
# Each push to main updates the release pull request, `chore(release): X.Y.Z`,
# which bumps the four crates' versions, their Cargo.lock entries and
# CHANGELOG.md. Merging it makes release-please tag vX.Y.Z and create a draft
# release with that version's notes. This run then builds both platforms at
# the tag with the same reusable workflows CI uses, attests the binaries'
# build provenance, attaches the Linux archive, the Windows zip and
# SHA256SUMS, and publishes the release. A failed build or attestation leaves
# the draft; rerunning the failed jobs completes it.
#
# release-please runs as a GitHub App (secrets RELEASE_APP_ID and
# RELEASE_APP_PRIVATE_KEY): pull requests opened with GITHUB_TOKEN trigger no
# workflows, and the release pull request needs CI and the title check.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release run at a time, never cancelled midway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  linux:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}

  windows:
    needs: [release-please, linux]
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
      winget-validate: false

  # Build provenance for every binary the release ships, and for the archives
  # that carry them, so `gh attestation verify FILE -R scmccart/brindle`
  # checks a download, or a binary unpacked from one, against this run. It
  # runs here rather than in the reusable build workflows because CI calls
  # those too, and a called workflow can't ask for id-token: write unless
  # every caller grants it. The builds ran earlier in this same run, which
  # is the run the provenance names.
  attest:
    needs: [release-please, linux, windows]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: brindle-*-x64
          path: dist
          merge-multiple: true
      - name: Unpack the binaries
        run: |
          mkdir -p bin/linux bin/windows
          tar -xzf dist/*.tar.gz -C bin/linux --strip-components=1
          unzip -q dist/*.zip -d bin/windows
          ls -l bin/linux bin/windows
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            bin/linux/brindle
            bin/linux/brindle-remote-linux-x86_64
            bin/windows/brindle.exe
            bin/windows/brindle-remote.exe

  publish:
    needs: [release-please, linux, windows, attest]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: brindle-*-x64
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum -- *.tar.gz *.zip brindle-ui-tokens.css > SHA256SUMS
          cat SHA256SUMS
      - name: Attach the assets
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/brindle-ui-tokens.css dist/SHA256SUMS --clobber
      - name: Publish
        run: gh release edit "$TAG" --draft=false
