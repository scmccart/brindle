# Releases, driven by Conventional Commits through release-please
# (release-please-config.json, .release-please-manifest.json).
#
# Each push to main updates the release pull request, `chore(release): X.Y.Z`,
# which bumps the four crates' versions, their Cargo.lock entries and
# CHANGELOG.md. Merging it makes release-please tag vX.Y.Z and create a draft
# release with that version's notes. This run then builds both platforms at
# the tag with the same reusable workflows CI uses, signs the Windows
# executables (the `sign` job), attests the binaries' build provenance,
# attaches the Linux archive, the Windows zip, the one-command installers
# (install.sh and install.ps1, stamped with the version) and SHA256SUMS, and
# publishes the release. A failed build, signing or attestation leaves the
# draft; rerunning the failed jobs completes it.
#
# release-please runs as a GitHub App (secrets RELEASE_APP_ID and
# RELEASE_APP_PRIVATE_KEY): pull requests opened with GITHUB_TOKEN trigger no
# workflows, and the release pull request needs CI and the title check.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release run at a time, never cancelled midway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  linux:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}

  windows:
    needs: [release-please, linux]
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
      winget-validate: false

  # Signs brindle.exe and brindle-remote.exe in the Windows zip with Azure
  # Artifact Signing and replaces the brindle-windows-x64 artifact with the
  # re-zipped result, so `attest` and `publish`, which run after it, attest,
  # hash and attach the signed binaries. It signs in OIDC as a managed
  # identity that trusts this repository's `release` environment (federated
  # credential subject repo:scmccart/brindle:environment:release; see the
  # shared-infrastructure repository). The environment holds secrets
  # AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID. CI builds are
  # not signed.
  sign:
    needs: [release-please, windows]
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: brindle-windows-x64
          path: unsigned
      - name: Unpack the zip
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem unsigned -Filter *.zip)
          if ($zips.Count -ne 1) { throw "expected one zip in unsigned/, found $($zips.Count)" }
          Expand-Archive -Path $zips[0].FullName -DestinationPath stage
          "ZIP_NAME=$($zips[0].Name)" >> $env:GITHUB_ENV
          Get-ChildItem stage | Format-Table Name, Length
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # The identity holds a role on the signing account, not on the subscription.
          allow-no-subscriptions: true
      - uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: scmccart-signing
          certificate-profile-name: public-trust
          files: |
            ${{ github.workspace }}\stage\brindle.exe
            ${{ github.workspace }}\stage\brindle-remote.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Check the signatures
        shell: pwsh
        run: |
          foreach ($name in 'brindle.exe', 'brindle-remote.exe') {
            $sig = Get-AuthenticodeSignature (Join-Path stage $name)
            if ($sig.Status -ne 'Valid') { throw "$name signature is $($sig.Status): $($sig.StatusMessage)" }
            "$name signed by $($sig.SignerCertificate.Subject)"
          }
      # Same layout as scripts/package-windows.ps1: the files at the zip's root.
      - name: Repack the zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signed | Out-Null
          Compress-Archive -Path "stage\*" -DestinationPath (Join-Path signed $env:ZIP_NAME)
      - uses: actions/upload-artifact@v7
        with:
          name: brindle-windows-x64
          path: signed/*.zip
          retention-days: 14
          overwrite: true

  # Build provenance for every binary the release ships, and for the archives
  # that carry them, so `gh attestation verify FILE -R scmccart/brindle`
  # checks a download, or a binary unpacked from one, against this run. It
  # runs here rather than in the reusable build workflows because CI calls
  # those too, and a called workflow can't ask for id-token: write unless
  # every caller grants it. The builds and the signing ran earlier in this
  # same run, which is the run the provenance names; it runs after `sign`, so
  # the Windows zip it downloads, and the executables unpacked from it, are
  # the signed ones.
  attest:
    needs: [release-please, linux, windows, sign]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: brindle-*-x64
          path: dist
          merge-multiple: true
      - name: Unpack the binaries
        run: |
          mkdir -p bin/linux bin/windows
          tar -xzf dist/*.tar.gz -C bin/linux --strip-components=1
          unzip -q dist/*.zip -d bin/windows
          ls -l bin/linux bin/windows
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            bin/linux/brindle
            bin/linux/brindle-remote-linux-x86_64
            bin/windows/brindle.exe
            bin/windows/brindle-remote.exe

  publish:
    needs: [release-please, linux, windows, sign, attest]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      # For the installer scripts, at the tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: brindle-*-x64
          path: dist
          merge-multiple: true
      # The one-command installers, scripts/get.sh and get.ps1, stamped with
      # this release's version so each installs its own release (README's
      # Installing).
      - name: Installers
        run: |
          version=${TAG#v}
          sed "s/@VERSION@/$version/" scripts/get.sh > dist/install.sh
          sed "s/@VERSION@/$version/" scripts/get.ps1 > dist/install.ps1
          for f in dist/install.sh dist/install.ps1; do
            grep -qF "'$version'" "$f" || { echo "$f isn't stamped with $version" >&2; exit 1; }
          done
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum -- *.tar.gz *.zip brindle-ui-tokens.css install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      - name: Attach the assets
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/brindle-ui-tokens.css \
            dist/install.sh dist/install.ps1 dist/SHA256SUMS --clobber
      - name: Publish
        run: gh release edit "$TAG" --draft=false
