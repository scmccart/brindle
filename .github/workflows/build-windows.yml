# The Windows build, tests, exe checks and release zip, called by CI and by
# releases after build-linux.yml, whose remote helper artifact the zip packs.
# The zip is installed and uninstalled through the one-command installer,
# then uploaded as brindle-windows-x64.
#
# No concurrency group here: the caller's applies, and a matching one would
# cancel the caller.

name: Build Windows

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build; empty for the caller's own.
        type: string
        default: ""
      winget-validate:
        description: Write the WinGet manifest for the zip and check it with winget validate.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # rust-toolchain.toml names the toolchain.
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - uses: actions/download-artifact@v7
        with:
          name: brindle-remote-linux-x86_64
          path: target/release
      # GPUI's release build compiles its shaders with fxc.exe, which it
      # otherwise looks for only on PATH and in one SDK version's directory.
      - name: Find fxc.exe
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { throw "no fxc.exe in the Windows SDK" }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      # The packaged ConPTY that remote-agent/build.rs embeds in brindle-remote.exe.
      - run: scripts/fetch-conpty.ps1
        shell: pwsh
      # Every workspace crate is a default member, so this builds brindle.exe
      # and the terminal server helper, brindle-remote.exe.
      - run: cargo build --release --locked
      # Tests that skip for want of a capability record it in
      # target/tmp/skipped.log; start it empty, and print it after the run.
      - name: Clear the skipped-tests log
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue target/tmp/skipped.log
      - run: cargo test --locked --workspace
        env:
          # Debug test binaries list their fault switches.
          BRINDLE_TEST_REQUIRE: fault-switches
      - name: Tests skipped for want of a capability
        if: always()
        shell: pwsh
        run: |
          if (Test-Path target/tmp/skipped.log) { Get-Content target/tmp/skipped.log } else { "none" }
      # The Linux clippy job never sees cfg(windows) code (src/win.rs,
      # terminal/process.rs, the helper's conpty/ and platform/windows/).
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: e2e harness self-test
        run: cargo test --locked -p brindle --test e2e -- --self-test
        env:
          BRINDLE_E2E: "1"
      - name: perf harness self-test
        run: cargo test --locked -p brindle --test perf -- --self-test
        env:
          BRINDLE_PERF: "1"
      - name: Version resource, icon and DPI manifest in brindle.exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/brindle.exe).Path
          $info = (Get-Item $exe).VersionInfo
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($info.ProductName -ne 'Brindle' -or $info.ProductVersion -ne $version) {
            throw "version resource: '$($info.ProductName)' '$($info.ProductVersion)', expected Brindle $version"
          }
          # Icon group 1 (RT_GROUP_ICON is 14) with all 8 sizes. Extracting
          # the icon proves nothing: Windows supplies a default one.
          Add-Type -Namespace Res -Name Api -MemberDefinition @'
          [DllImport("kernel32", CharSet = CharSet.Unicode)] public static extern IntPtr LoadLibraryExW(string file, IntPtr reserved, uint flags);
          [DllImport("kernel32")] public static extern IntPtr FindResourceW(IntPtr module, IntPtr name, IntPtr type);
          [DllImport("kernel32")] public static extern IntPtr LoadResource(IntPtr module, IntPtr info);
          [DllImport("kernel32")] public static extern IntPtr LockResource(IntPtr data);
          '@
          $module = [Res.Api]::LoadLibraryExW($exe, 0, 2) # LOAD_LIBRARY_AS_DATAFILE
          $group = [Res.Api]::FindResourceW($module, 1, 14)
          if ($group -eq 0) { throw 'no icon in brindle.exe' }
          $count = [Runtime.InteropServices.Marshal]::ReadInt16([Res.Api]::LockResource([Res.Api]::LoadResource($module, $group)), 4)
          if ($count -ne 8) { throw "the icon has $count sizes, expected 8" }
          # GPUI embeds the manifest; without it the window renders blurry above 100% scale.
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName | Select-Object -Last 1
          & $mt.FullName -nologo "-inputresource:$exe;#1" "-out:manifest.xml"
          if (-not (Select-String -Path manifest.xml -Pattern 'PerMonitorV2' -Quiet)) { throw 'no PerMonitorV2 in the manifest' }
      - name: Version resource and --version of brindle-remote.exe
        shell: pwsh
        run: |
          $helper = (Resolve-Path target/release/brindle-remote.exe).Path
          $info = (Get-Item $helper).VersionInfo
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($info.ProductName -ne 'Brindle' -or $info.ProductVersion -ne $version -or $info.OriginalFilename -ne 'brindle-remote.exe') {
            throw "version resource: '$($info.ProductName)' '$($info.ProductVersion)' '$($info.OriginalFilename)', expected Brindle $version brindle-remote.exe"
          }
          # A console program, so PowerShell waits for it.
          $out = & $helper --version
          if ($LASTEXITCODE -ne 0) { throw "brindle-remote.exe --version exited $LASTEXITCODE" }
          if ("$out".Trim() -ne $version) { throw "brindle-remote.exe --version printed '$out', expected $version" }
      # brindle.exe is a GUI program, so PowerShell waits for it only
      # through Start-Process -Wait.
      - name: Start Menu shortcut (--install-desktop / --uninstall-desktop)
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/brindle.exe).Path
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Brindle.lnk'
          function Run($arguments) { (Start-Process $exe -ArgumentList $arguments -Wait -PassThru -NoNewWindow).ExitCode }
          if ((Run '--install-desktop') -ne 0 -or -not (Test-Path $lnk)) { throw 'install failed' }
          $item = (New-Object -ComObject Shell.Application).Namespace((Split-Path $lnk)).ParseName('Brindle.lnk')
          $id = $item.ExtendedProperty('System.AppUserModel.ID')
          if ($id -ne 'Brindle.Terminal') { throw "AppUserModelID is '$id'" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne $exe) { throw "target is '$target'" }
          # Through a symlink, as WinGet runs it: the shortcut starts the
          # link, and takes its icon from the exe, since the shell reads no
          # icon through a link.
          New-Item -ItemType Directory -Force target/links | Out-Null
          $link = (New-Item -ItemType SymbolicLink -Force -Path target/links/brindle.exe -Target $exe).FullName
          $code = (Start-Process $link -ArgumentList '--install-desktop' -Wait -PassThru -NoNewWindow).ExitCode
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($code -ne 0 -or $shortcut.TargetPath -ne $link) { throw "through a link: exit $code, target '$($shortcut.TargetPath)'" }
          if ($shortcut.IconLocation -ne "$exe,0") { throw "through a link: icon '$($shortcut.IconLocation)'" }
          if ((Run '--uninstall-desktop') -ne 0 -or (Test-Path $lnk)) { throw 'uninstall failed' }
          if ((Run '--uninstall-desktop') -ne 0) { throw 'uninstalling twice failed' }
          if ((Run '--install-desktop --prefix C:\Tools') -ne 2 -or (Test-Path $lnk)) { throw '--prefix was not rejected' }
      # A Windows release is one zip: brindle.exe with brindle-remote.exe
      # beside it, which local tabs need and which carries the packaged ConPTY.
      - name: Release zip
        id: zip
        shell: pwsh
        run: |
          $zip = scripts/package-windows.ps1 -Exe target/release/brindle.exe -Helper target/release/brindle-remote.exe
          "path=$zip" >> $env:GITHUB_OUTPUT
      # The zip holds exactly the files scripts/package-windows.ps1 names, so
      # nothing else this build makes (the tests' fake ACP agent, say) slips
      # in. A change to what it packs changes this list with it.
      - name: Release zip contents
        shell: pwsh
        env:
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          $expected = @('brindle.exe', 'brindle-remote.exe', 'brindle-remote-linux-x86_64', 'LICENSE-APACHE', 'LICENSE-MIT', 'THIRD-PARTY-NOTICES.txt')
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($env:ZIP)
          try { $actual = @($archive.Entries | ForEach-Object { $_.FullName }) } finally { $archive.Dispose() }
          $actual | Write-Host
          $want = ($expected | Sort-Object -CaseSensitive) -join "`n"
          $got = ($actual | Sort-Object -CaseSensitive) -join "`n"
          if ($got -cne $want) {
            Write-Host "expected:`n$want"
            throw "the zip's files aren't the expected ones"
          }
      # The one-command installer as a release publishes it (release.yml
      # stamps scripts/get.ps1 as install.ps1), run through iex in a new
      # PowerShell as a user would, against this zip in a local release
      # directory and into a private prefix: an install (Windows PowerShell
      # 5.1), a tampered SHA256SUMS that must fail and change nothing, and an
      # uninstall (pwsh). A line the shell runs after the installer shows it
      # didn't exit. The Start Menu shortcut has no prefix, so the uninstall
      # must remove it again.
      - name: One-command install and uninstall
        shell: pwsh
        env:
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $zip = Split-Path -Leaf $env:ZIP
          $release = Join-Path $env:RUNNER_TEMP 'release'
          $prefix = Join-Path $env:RUNNER_TEMP 'brindle prefix'
          $script = Join-Path $release 'install.ps1'
          $sums = Join-Path $release 'SHA256SUMS'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Brindle.lnk'
          New-Item -ItemType Directory -Force $release | Out-Null
          Copy-Item $env:ZIP $release
          [IO.File]::WriteAllText($script, (Get-Content -Raw scripts/get.ps1).Replace('@VERSION@', $version))
          $hash = (Get-FileHash (Join-Path $release $zip)).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($sums, "$hash  $zip`n")
          $env:BRINDLE_DOWNLOAD_BASE = ([Uri]$release).AbsoluteUri
          $env:BRINDLE_PREFIX = $prefix
          function Invoke-Installer([string]$Shell, [string]$Line) {
            $out = @("$Line`n'shell still open'`n" | & $Shell -NoProfile -Command - 2>&1 | ForEach-Object { "$_" })
            $out | Write-Host
            if ($out -notcontains 'shell still open') { throw "the installer closed $Shell" }
            $out -join "`n"
          }
          function Get-State {
            Get-ChildItem -LiteralPath $prefix | ForEach-Object { "$($_.Name) $($_.LastWriteTimeUtc.Ticks) $((Get-FileHash -LiteralPath $_.FullName).Hash)" }
          }
          function Test-OnPath { @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $prefix }

          Invoke-Installer powershell.exe "Get-Content -Raw '$script' | Invoke-Expression" | Out-Null
          $said = (& (Join-Path $prefix 'brindle.exe') --version | Out-String).Trim()
          if ($said -ne "brindle $version") { throw "brindle --version printed '$said'" }
          foreach ($name in 'brindle-remote.exe', 'brindle-remote-linux-x86_64') {
            if (-not (Test-Path -LiteralPath (Join-Path $prefix $name))) { throw "no $name in $prefix" }
          }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne (Join-Path $prefix 'brindle.exe')) { throw "the shortcut's target is '$target'" }
          if (-not (Test-OnPath)) { throw "$prefix isn't on the user PATH" }

          $before = Get-State
          [IO.File]::WriteAllText($sums, ('0' * 64) + "  $zip`n")
          $out = Invoke-Installer pwsh "Get-Content -Raw '$script' | Invoke-Expression"
          if ($out -notmatch 'checksum failed') { throw 'a tampered SHA256SUMS installed' }
          if (((Get-State) -join "`n") -ne ($before -join "`n")) { throw 'a tampered SHA256SUMS changed the install' }

          # As parameters this time, through the script block form.
          Remove-Item env:BRINDLE_PREFIX
          Invoke-Installer pwsh "& ([scriptblock]::Create((Get-Content -Raw '$script'))) -Uninstall -Prefix '$prefix'" | Out-Null
          if (Test-Path -LiteralPath $prefix) { throw "$prefix is left" }
          if (Test-Path $lnk) { throw 'the Start Menu shortcut is left' }
          if (Test-OnPath) { throw "$prefix is left on the user PATH" }
      - name: WinGet manifest
        if: inputs.winget-validate
        shell: pwsh
        env:
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          winget --version
          $manifest = scripts/winget-manifest.ps1 -Zip $env:ZIP
          winget validate --disable-interactivity --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed for $manifest" }
      - uses: actions/upload-artifact@v7
        with:
          name: brindle-windows-x64
          path: target/dist/*.zip
          retention-days: 14
