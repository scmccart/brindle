# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# The release zip holds brindle.exe, which needs nothing beside it, so WinGet
# installs it as a portable command and links it onto PATH as `brindle`.
PackageIdentifier: scmccart.brindle
PackageVersion: "{{version}}"
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: brindle.exe
    PortableCommandAlias: brindle
# Windows 11 only.
MinimumOSVersion: 10.0.22000.0
Installers:
  - Architecture: x64
    InstallerUrl: "{{url}}"
    InstallerSha256: "{{sha256}}"
ManifestType: installer
ManifestVersion: 1.10.0
