# Brindle configuration.
# Reload with ctrl-shift-r (or restart). Every setting is optional.

# Profile used for new tabs (ctrl-shift-t) and new windows.
default_profile = "Shell"

# Built-in themes: brindle-dark, brindle-light, tokyo-night, gruvbox-dark,
# solarized-dark. Define your own under [themes.<name>], or pick and edit
# themes with a live preview in the settings dialog (ctrl-shift-,).
theme = "brindle-dark"

scrollback_lines = 10000
padding = 6
copy_on_select = false
# Let programs read your clipboard through OSC 52. Writing is always allowed
# (that is what tmux `set-clipboard on` uses).
osc52_paste = false
# Reopen the windows and tabs you had (profiles, directories, tmux control-mode
# sessions) when Brindle is launched without -p/-d/-e. Scrollback is not kept.
# `brindle --no-restore` skips it once.
restore_session = false
# With shell integration loaded (see the README, or run
# `brindle --shell-integration bash|zsh|fish`), draw a red bar beside prompts
# whose command exited non-zero.
mark_failed_commands = true
# When a tmux control-mode session detaches or ends (its last shell exits)
# and its tabs were all the window had: "close_window", "new_tab" (open the
# default profile, or the first non-tmux one), or "ask".
tmux_session_end = "close_window"

[font]
# First installed family wins.
family = ["JetBrains Mono", "FiraCode Nerd Font Mono", "Hack Nerd Font Mono", "DejaVu Sans Mono", "Liberation Mono", "Cascadia Mono", "Consolas"]
size = 14
line_height = 1.25

[cursor]
shape = "block"   # block | beam | underline
blink = true

# Desktop notifications. Programs ask for them with OSC 9 or OSC 777, e.g.
#   printf '\033]777;notify;Build;finished\a'
# and a bell (BEL) raises one too. Clicking a notification shows its tab.
[notifications]
bell = true
osc9 = true
osc777 = true
# "unfocused": only for a tab that isn't in front of you (a background tab,
# or any tab while its window isn't focused). "always": every time.
when = "unfocused"

# ---------------------------------------------------------------------------
# Profiles. Open the new-tab palette with ctrl-shift-space, or open profile N
# directly with ctrl-alt-N. Profiles can also be edited in the settings dialog
# (ctrl-shift-,).
# ---------------------------------------------------------------------------

[[profiles]]
name = "Shell"
# Without a command: $SHELL, else /bin/sh. On Windows: pwsh.exe, else
# powershell.exe, else %COMSPEC% (cmd.exe).
# command = "/bin/zsh"
# args = ["-l"]
# cwd = "~"
# env = { EDITOR = "nvim" }
# theme = "tokyo-night"
# font_size = 13

# tmux in control mode: each tmux window becomes a Brindle tab and panes are
# drawn natively. Detaching (ctrl-shift-d) keeps the session running; what the
# window does afterwards is set by tmux_session_end above.
[[profiles]]
name = "tmux"
tmux = "control"
tmux_session = "main"

# Classic tmux running inside the terminal, with full mouse, clipboard
# (OSC 52), true-color and focus-event support.
[[profiles]]
name = "tmux (classic)"
tmux = "plain"
tmux_session = "main"

# On Windows, tmux in control mode inside WSL. tmux_args are WSL's options
# (e.g. "-d", "Ubuntu"), then "tmux", then tmux's options.
# [[profiles]]
# name = "tmux (WSL)"
# tmux = "control"
# command = "wsl"
# tmux_args = ["tmux"]

# ---------------------------------------------------------------------------
# Custom themes. Unspecified colors inherit from brindle-dark.
# ---------------------------------------------------------------------------
# [themes.my-theme]
# foreground = "#d0d0d0"
# background = "#101010"
# cursor = "#ffcc00"
# selection_background = "#404040"
# Find bar (ctrl-shift-f) highlights. Left out, they come from the theme's
# own yellow: dim marks for every match, solid for the current one.
# search_match_background = "#625a20"
# search_match_foreground = "#d0d0d0"
# search_focused_match_background = "#c4a000"
# search_focused_match_foreground = "#101010"
# ansi = ["#000000", "#cc0000", "#4e9a06", "#c4a000", "#3465a4", "#75507b", "#06989a", "#d3d7cf",
#         "#555753", "#ef2929", "#8ae234", "#fce94f", "#729fcf", "#ad7fa8", "#34e2e2", "#eeeeec"]

# ---------------------------------------------------------------------------
# Extra keybindings ("keys" = "action"). Run `brindle --list-actions` to see
# every action name. Bind to "none" to disable a default binding.
# ---------------------------------------------------------------------------
[keybindings]
# "ctrl-shift-enter" = "new_window"
