[package]
name = "brindle-remote-protocol"
version = "0.3.0"
edition = "2024"
description = "Framed stdio protocol between Brindle and its brindle-remote helper"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"

# Tokens, security descriptors and pipe peers for the terminal server (`win`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
