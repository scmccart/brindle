[package]
name = "brindle"
version = "0.1.0"
edition = "2024"
description = "A GPU-accelerated terminal emulator built on GPUI, with tabs, profiles and first-class tmux support"
license = "MIT OR Apache-2.0"
default-run = "brindle"

[dependencies]
gpui = "0.2.2"
alacritty_terminal = "0.26.0"
anyhow = "1"
base64 = "0.22"
dirs = "5"
env_logger = "0.11"
futures = "0.3"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
smallvec = "1"
toml = "0.8"
toml_edit = "0.22.27"
unicode-width = "0.2"
libc = "0.2"

[dev-dependencies]
# Window captures for the end-to-end suite; the version GPUI already uses.
x11rb = "=0.13.2"

# Opt-in end-to-end suite: BRINDLE_E2E=1 cargo test --test e2e -- [case...]
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
