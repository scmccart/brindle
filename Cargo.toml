[package]
name = "brindle"
version = "0.1.0"
edition = "2024"
description = "A GPU-accelerated terminal emulator built on GPUI, with tabs, profiles and first-class tmux support"
license = "MIT OR Apache-2.0"
default-run = "brindle"

[dependencies]
gpui = "0.2.2"
alacritty_terminal = "0.26.0"
anyhow = "1"
base64 = "0.22"
dirs = "5"
env_logger = "0.11"
futures = "0.3"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
smallvec = "1"
toml = "0.8"
toml_edit = "0.22.27"
shlex = "1.3"
unicode-width = "0.2"
# Names the types in alacritty's `EventedReadWrite` trait (shell integration
# wraps its PTY); the version alacritty_terminal already uses.
polling = "=3.11.0"
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Desktop notifications over D-Bus, and raising a window with the
# notification server's activation token on Wayland. All of these are
# already built for gpui, at these versions and with these features.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.12", default-features = false, features = ["async-io"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.31.2", features = ["client", "staging"] }

# The pseudoconsole, process snapshots, shortcuts and toasts. GPUI already
# builds this version, so only the features below are new.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

# Window captures for the end-to-end suite; the version GPUI already uses.
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "=0.13.2"

# Icon and version resources in brindle.exe; the version GPUI already uses.
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

# Opt-in end-to-end suite: BRINDLE_E2E=1 cargo test --test e2e -- [case...]
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false

# Opt-in performance suite: BRINDLE_PERF=1 cargo test --test perf -- [case...]
[[test]]
name = "perf"
path = "tests/perf/main.rs"
harness = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
